# Shared by app and horizon: container hostnames for the database and Redis
# (they override the 127.0.0.1 values in .env, which are for host access).
x-app-environment: &app-environment
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-pud_app}
    DB_USERNAME: ${DB_USERNAME:-pud_app}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    INERTIA_SSR_URL: http://ssr:13714
    # SSR in dev goes through the Vite container (public/hot points at 0.0.0.0).
    INERTIA_SSR_HOT_URL: http://vite:5173

services:
    app:
        build:
            context: ./docker/app
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: pud-app
        volumes:
            - .:/var/www/html
        ports:
            - '${APP_PORT:-8000}:8000'
        environment: *app-environment
        # PHP's built-in server with Laravel's router (what `artisan serve` uses),
        # run directly so the DB_* values above aren't overridden by .env.
        # The router uses the current directory as the public path, so start in public/.
        command:
            [
                'sh',
                '-c',
                'cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php',
            ]
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Queue workers, managed by Horizon (dashboard: /horizon).
    # Restart it after changing job code: `docker compose restart horizon`.
    horizon:
        image: pud-app
        volumes:
            - .:/var/www/html
        environment: *app-environment
        command: ['php', 'artisan', 'horizon']
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Vite dev server (HMR). Same image and code mount as `app`; writes
    # public/hot so Laravel serves assets from it. Installs node_modules
    # on first start if they're missing.
    vite:
        image: pud-app
        volumes:
            - .:/var/www/html
        ports:
            - '${VITE_PORT:-5173}:5173'
        command:
            [
                'sh',
                '-c',
                '[ -d node_modules ] || npm install --no-audit --no-fund; exec npm run dev -- --host 0.0.0.0',
            ]
        depends_on:
            - app

    # Inertia SSR server for the public pages. Needs the SSR bundle: `npm run build:ssr`.
    # (While `npm run dev` runs, Laravel renders through the Vite dev server instead.)
    ssr:
        image: pud-app
        volumes:
            - .:/var/www/html
        command: ['php', 'artisan', 'inertia:start-ssr']
        restart: unless-stopped

    redis:
        image: redis:8.10-alpine
        volumes:
            - redisdata:/data
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-pud_app}
            POSTGRES_USER: ${DB_USERNAME:-pud_app}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pgdata:/var/lib/postgresql
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
    redisdata:
